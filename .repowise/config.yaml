commit_limit: 1000
follow_renames: true
embedder: mock
exclude_patterns:
- AGENTS.md
- .mcp.json
- .context/STATE.md
- .context/SESSION_COUNTER
- .context/sessions/**
- .context/specs/**
- .specify/**
- .agents/**
- .codex/**
- .opencode/**
- .serena/**
- .development/**
editor_files:
  claude_md: false
  agents_md: false
decisions:
  enabled: true
  llm: false
  sources:
    inline_marker: true
    adr: true
    git_archaeology: false
    pr: false
    comment: false
    session_discovery: false
    session: false
    conventions: false
  agent_acceptance: false
  capture_prompt: false
distill:
  enabled: false
  commands:
    enabled: false
hooks:
  read_skeleton: false
  read_reread: false
  search_digest: false
  coverage_reingest: false
mcp:
  tools:
  - get_overview
  - get_context
  - get_risk
  - get_change_risk
  - get_why
  - get_health
  - get_dead_code
